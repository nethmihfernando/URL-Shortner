spring.application.name=url-shortener
server.port=${PORT:8080}

# MongoDB connection. Override with the MONGODB_URI environment variable.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/url_shortener}
# Creates the unique index on shortCode at startup.
spring.data.mongodb.auto-index-creation=true

# Length of generated short codes (Base62 characters, allowed range 4-32).
app.short-code-length=7
